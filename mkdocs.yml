site_name: vf-wiki
site_description: Markdown knowledge base for humans and LLMs
docs_dir: docs
site_dir: site
strict: true
theme:
  name: readthedocs
plugins:
  - search
  - mermaid2:
      arguments:
        theme: neutral
nav:
  - Home: index.md
  - Repository Overview: repository_overview.md
  - Repository Structure: repo_structure.md
  - Governance:
      - Lifecycle Model: 00_governance/lifecycle_model.md
      - Naming and Identification Convention: 00_governance/naming_identification_convention.md
      - Tailoring and Derived Documents Register: 00_governance/tailoring_derived_documents_register.md
  - Lifecycle Processes:
      - Overview: 10_lifecycle/index.md
      - T0 to B0:
          - B0 Requirement Capture Process: 10_lifecycle/t0_b0/b0_requirement_capture_process.md
          - B0 Readiness Review: 10_lifecycle/t0_b0/b0_readiness_review.md
          - T0 to B0 to SSS-SYS Mapping: 10_lifecycle/t0_b0/t0_b0_to_sss_sys_mapping.md
  - Templates:
      - Overview: 90_templates/index.md
      - Requirements:
          - Overview: 90_templates/02_requirements/index.md
          - System:
              - Overview: 90_templates/02_requirements/00_system/index.md
              - SSS-SYS: 90_templates/02_requirements/00_system/SSS-SYS.md
  - Agent Guide: AGENTS.md
markdown_extensions:
  - tables
  - pymdownx.snippets:
      base_path: .
      check_paths: true
      restrict_base_path: true
  - toc:
      permalink: true
